{% extends "base.html" %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="height: 80px; width: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 1rem; display: block;">
        <h1 style="text-align: center;">Admin Login</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-primary full-width">Login</button>
        </form>
        <!-- <p class="note small" style="text-align: center;">Default: admin / admin123</p> -->
    </div>
</section>
{% endblock %}
